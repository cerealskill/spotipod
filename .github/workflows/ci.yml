name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Los tests solo cubren el iTunesDB reader/writer (tools/itunesdb.py), que es Python
      # puro (stdlib) — no hace falta instalar las dependencias de audio.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Byte-compile all sources
        run: python -m py_compile spotipod.py tools/*.py tests/*.py

      - name: Run tests
        run: pytest -q
